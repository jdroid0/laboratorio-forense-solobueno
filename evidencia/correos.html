  .bar{max-width:1100px;margin:16px auto 8px;padding:0 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .bar input{flex:1;min-width:220px;padding:9px 12px;border:1px solid var(--linea);border-radius:7px;font-size:14px;}
  .bar button{padding:9px 14px;border:none;background:var(--azul2);color:#fff;border-radius:7px;cursor:pointer;font-size:13px;}
  .bar button:hover{background:var(--azul);}
  .bar span{font-size:13px;color:#5a6b7d;}
  .wrap{max-width:1100px;margin:0 auto 30px;padding:0 16px;}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--linea);border-radius:8px;overflow:hidden;}
  th,td{padding:9px 12px;text-align:left;font-size:13.5px;border-bottom:1px solid #eef1f5;}
  th{background:#eef3fa;color:var(--azul);cursor:pointer;user-select:none;white-space:nowrap;}
  th:hover{background:#e2ebf6;}
  tbody tr{cursor:pointer;}
  tbody tr:hover{background:#f6f9fd;}
  td.sp{text-align:center;font-size:15px;}
  tr.spam td{color:#8a4b4b;}
  .overlay{position:fixed;inset:0;background:rgba(20,30,45,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;}
  .modal{background:#fff;max-width:760px;width:100%;border-radius:12px;padding:24px;}
  .modal h2{margin:0 0 4px;font-size:18px;color:var(--azul);}
  .meta{font-size:13px;color:#5a6b7d;margin:2px 0;}
  .cuerpo{margin:16px 0;font-size:14.5px;line-height:1.55;white-space:pre-wrap;}
  .adj{margin-top:16px;border-top:1px solid var(--linea);padding-top:14px;}
  .adj h3{font-size:14px;margin:0 0 8px;color:var(--azul);}
  .adj button{background:var(--azul2);color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;margin:0 8px 8px 0;}
  .adj img{max-width:100%;border:1px solid var(--linea);border-radius:6px;margin-top:8px;}
  .cerrar{float:right;background:#e6ebf1;border:none;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;}
  .spamtag{display:inline-block;background:#f3dede;color:#9e4b4b;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:8px;}
</style>

let sortKey='ts', sortDir=-1, filtro='';
const tb=document.getElementById('tb');
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function filtrados(){
  return DATA.filter(e=>{ if(!filtro)return true; const f=filtro.toLowerCase();
    return e.from.toLowerCase().includes(f)||e.nombre.toLowerCase().includes(f)||e.asunto.toLowerCase().includes(f);});
}
function render(){
  let rows=filtrados();
  rows.sort((a,b)=>{let va=a[sortKey],vb=b[sortKey]; if(typeof va==='string'){va=va.toLowerCase();vb=vb.toLowerCase();}
    if(va<vb)return -1*sortDir; if(va>vb)return 1*sortDir; return 0;});
  tb.innerHTML=rows.map(e=>'<tr class="'+(e.detectado?'spam':'')+'" onclick="abrir('+e.id+')">'+
    '<td>'+e.fecha+'</td><td>'+esc(e.from)+'</td><td>'+esc(e.nombre)+'</td><td>'+esc(e.asunto)+'</td>'+
    '<td class="sp">'+(e.detectado?'🚫':'')+'</td></tr>').join('');
  document.getElementById('count').textContent=rows.length+' correos';
}
function sortBy(k){ if(sortKey===k)sortDir*=-1; else{sortKey=k;sortDir=(k==='ts')?-1:1;} render(); }
function abrir(id){
  const e=DATA.find(x=>x.id===id);
  let imgs='', btns='';
  e.adjuntos.forEach((a,i)=>{
    btns+='<button onclick="descargar('+id+','+i+')">Descargar '+esc(a.nombre)+'</button>';
    if(a.tipo==='png') imgs+='<img src="data:image/png;base64,'+a.data+'" alt="'+esc(a.nombre)+'">';
  });
  const adj = e.adjuntos.length ? '<div class="adj"><h3>Archivos adjuntos</h3>'+btns+imgs+'</div>' : '';
  document.getElementById('md').innerHTML=
    '<button class="cerrar" onclick="cerrar()">Cerrar</button>'+
    '<h2>'+esc(e.asunto)+(e.detectado?'<span class="spamtag">posible SPAM</span>':'')+'</h2>'+
    '<p class="meta">De '+esc(e.nombre)+' ('+esc(e.from)+')</p>'+
    '<p class="meta">Para it@solobueno.cr</p>'+
    '<p class="meta">Fecha '+e.fecha+'</p>'+
    '<div class="cuerpo">'+esc(e.cuerpo)+'</div>'+adj;
  document.getElementById('ov').style.display='flex';
}
function cerrar(){ document.getElementById('ov').style.display='none'; }
function descargar(id,i){
  const a=DATA.find(x=>x.id===id).adjuntos[i]; let blob;
  if(a.b64){ const bin=atob(a.data); const arr=new Uint8Array(bin.length);
    for(let j=0;j<bin.length;j++)arr[j]=bin.charCodeAt(j); blob=new Blob([arr],{type:a.mime}); }
  else blob=new Blob([a.data],{type:a.mime});
  const el=document.createElement('a'); el.href=URL.createObjectURL(blob); el.download=a.nombre; el.click();
}
function csvCell(v){ v=String(v==null?'':v); if(/[",\n\r;]/.test(v)) v='"'+v.replace(/"/g,'""')+'"'; return v; }
function exportarCSV(){
  const rows=filtrados();
  const head=["id","fecha","remitente","nombre","asunto","es_spam","detectado_como_spam","num_adjuntos","cuerpo"];
  const out=[head.join(",")];
  rows.forEach(e=>out.push([e.id,e.fecha,e.from,e.nombre,e.asunto,e.spam,e.detectado,e.adjuntos.length,e.cuerpo].map(csvCell).join(",")));
  const blob=new Blob(["﻿"+out.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="correos_solobueno.csv"; a.click();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrar();});
render();
